<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Installed app (Add to Home Screen): fullscreen, own icon and name. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Blackwall" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2228" />
    <title>Blackwall · bcndlabs</title>
    <script>
      // Apply the saved theme and font before first paint (no flash of the wrong theme).
      try {
        var p = JSON.parse(localStorage.getItem("blackwall.prefs") || "{}").state || {}
        document.documentElement.dataset.theme = p.theme === "dark" ? "dark" : "dim"
        document.documentElement.dataset.font = p.uiFont === "mono" ? "mono" : "sans"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
