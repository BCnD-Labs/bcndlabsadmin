# Blackwall on the home server. Deploy as a Portainer stack:
#   Stacks → Add stack → Repository → this repo, compose path: blackwall-admin/deploy/docker-compose.yml
# and fill in the environment variables from .env.example. See deploy/README.md.
name: blackwall

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blackwall
      POSTGRES_USER: blackwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackwall -d blackwall"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: blackwall-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://blackwall:${POSTGRES_PASSWORD}@db:5432/blackwall
      BLACKWALL_SECRET_KEY: ${BLACKWALL_SECRET_KEY:?set BLACKWALL_SECRET_KEY}
      BLACKWALL_PASSWORD_HASH: ${BLACKWALL_PASSWORD_HASH:?set BLACKWALL_PASSWORD_HASH}
      BLACKWALL_ALLOWED_HOSTS: ${BLACKWALL_ALLOWED_HOSTS:-}
      BACKUP_DIR: /backups
      # Settings → General: check for updates and update from the panel (optional; see deploy/README.md).
      BLACKWALL_UPDATE_WEBHOOK: ${BLACKWALL_UPDATE_WEBHOOK:-}
      BLACKWALL_UPDATE_INSECURE_TLS: ${BLACKWALL_UPDATE_INSECURE_TLS:-}
      BLACKWALL_UPDATE_GITHUB_TOKEN: ${BLACKWALL_UPDATE_GITHUB_TOKEN:-}
      BLACKWALL_UPDATE_REPO: ${BLACKWALL_UPDATE_REPO:-BCnD-Labs/bcndlabsadmin}
      BLACKWALL_UPDATE_REF: ${BLACKWALL_UPDATE_REF:-main}
    # Lets the app reach Portainer on the server itself for the update webhook.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only reachable from the server itself; `tailscale serve` publishes it to your tailnet over HTTPS.
    ports:
      - "127.0.0.1:${BLACKWALL_PORT:-8780}:8780"
    volumes:
      - ${BACKUP_DIR_HOST:-/opt/blackwall/backups}:/backups:ro
    networks: [internal]

  backup:
    build: ./backup
    image: blackwall-backup:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: blackwall
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: blackwall
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # Off-site copy (optional): an rclone remote named "offsite", configured by env.
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-60}
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCOUNT: ${OFFSITE_ACCOUNT:-}
      RCLONE_CONFIG_OFFSITE_KEY: ${OFFSITE_KEY:-}
    volumes:
      - ${BACKUP_DIR_HOST:-/opt/blackwall/backups}:/backups
    networks: [internal]

volumes:
  db-data:

networks:
  internal:
