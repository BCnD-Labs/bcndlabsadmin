name: Android APK

# Builds the installable Android app on GitHub's machines (no Mac needed) and attaches it,
# with the android.json update manifest the in-app "Check for update" reads, to a prerelease:
#   - after a mobile change is merged to main (tag apk-build-<number>);
#   - on request (Actions -> Android APK -> Run workflow).
# Pull requests retain a skipped APK check so branch rules can still evaluate it quickly.
# The APK is signed with the debug key Expo's generated project ships with: fine for your own
# phone, not for the Play Store.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write # creates the prerelease that holds the APK

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: npm --prefix mobile ci --ignore-scripts
      - name: Assign a new Android build number
        working-directory: mobile
        run: |
          node -e '
            const fs = require("fs")
            const file = "app.json"
            const app = JSON.parse(fs.readFileSync(file, "utf8"))
            // Workflow run numbers increase across PR, manual and main builds. The offset
            // keeps every generated build above the older hand-numbered APKs.
            const code = 1000 + Number(process.env.GITHUB_RUN_NUMBER)
            if (!Number.isSafeInteger(code) || code > 2100000000) throw Error("Invalid Android build number")
            app.expo.android.versionCode = code
            fs.writeFileSync(file, JSON.stringify(app, null, 2) + "\n")
            console.log(`Android build ${code}`)
          '
      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean
      - name: "Build the release APK (arm64 only, for phones, keeps it fast)"
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon --console=plain
      - name: Name the APK and write the update manifest
        working-directory: mobile
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto")
            const app = JSON.parse(fs.readFileSync("app.json", "utf8")).expo
            const versionCode = app.android.versionCode, versionName = app.version
            const file = `blackwall-android-${versionCode}.apk`
            fs.mkdirSync("dist-apk", { recursive: true })
            fs.copyFileSync("android/app/build/outputs/apk/release/app-release.apk", `dist-apk/${file}`)
            const bytes = fs.readFileSync(`dist-apk/${file}`)
            const sha256 = crypto.createHash("sha256").update(bytes).digest("hex")
            const md5 = crypto.createHash("md5").update(bytes).digest("hex") // the app checks this after downloading
            fs.writeFileSync("dist-apk/android.json", JSON.stringify({ versionCode, versionName, file, sha256, md5 }, null, 2) + "\n")
            console.log(fs.readFileSync("dist-apk/android.json", "utf8"))
          '
          ls -l dist-apk
      - name: Publish to a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          code=$(node -p 'JSON.parse(require("fs").readFileSync("mobile/dist-apk/android.json","utf8")).versionCode')
          tag="apk-build-$code"
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" mobile/dist-apk/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "Android build $code" \
            --notes "Debug-signed Android build $code from commit ${SHA:0:7}. Install the .apk; android.json is the update manifest."
          echo "Published $tag" | tee -a "$GITHUB_STEP_SUMMARY"
